name: Deploy Broadcast Copy (marketing)

# broadcastcopy.ai — the Broadcast Copy marketing site (apps/marketing).
# Separate from deploy.yml on purpose: its own concurrency group so a marketing
# push never cancels an in-flight WCCG station deploy, and a path filter so the
# station site isn't rebuilt when only marketing copy changes.
#
# COUPLING WARNING: this docroot (public_html/broadcastcopy.ai) sits inside the
# WCCG docroot, so deploy.yml's `mirror --delete` into public_html/ MUST keep its
# `--exclude-glob broadcastcopy.ai/`. Without it, the WCCG deploy (which also
# runs on a 4x/day cron) silently deletes this whole site.

on:
  push:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - '.github/workflows/deploy-marketing.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'deploy-marketing'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build marketing site
        env:
          # PUBLIC by design — the project URL ships in every page and
          # sb_publishable_* is Supabase's publishable client key (RLS-protected).
          # anon can only INSERT into bc_leads; it cannot read leads back.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://irjiqbmoohklagdegezz.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_w9EytFGBM7mEvefmGhsZ9w_bXbmNjQ4' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.MARKETING_SITE_URL || 'https://broadcastcopy.ai' }}
        run: pnpm --filter marketing build

      # Static export needs <route>/index.html so deep links don't 404 on Apache.
      - name: Generate index.html for directories
        run: |
          cd apps/marketing/out
          find . -maxdepth 5 -name "*.html" \
            -not -name "index.html" \
            -not -name "404.html" \
            -not -name "_not-found.html" | while read html; do
            dir="${html%.html}"
            if [ -d "$dir" ] && [ ! -f "$dir/index.html" ]; then
              cp "$html" "$dir/index.html"
            fi
          done

      - name: Upload marketing artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketing-build
          path: apps/marketing/out
          # v4 drops dotfiles by default — without this .htaccess never ships.
          include-hidden-files: true

  deploy-knownhost:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Auth is the ed25519 deploy key, NOT the account password: the 2026-08-06
      # KnownHost migration to the Centova VPS invalidated the stored password —
      # deploy.yml was converted on 2026-08-10; this workflow kept failing
      # silently until 2026-08-11 (the site sat dark behind a 403 the whole
      # time, which is what finally surfaced it).
      - name: Preflight — required secrets + docroot safety
        id: preflight
        env:
          KH_HOST: ${{ secrets.KNOWNHOST_SSH_HOST }}
          KH_USER: ${{ secrets.KNOWNHOST_SSH_USER }}
          KH_KEY: ${{ secrets.KNOWNHOST_SSH_KEY }}
          KH_PATH: ${{ secrets.KNOWNHOST_MARKETING_PATH }}
        run: |
          missing=()
          [ -z "$KH_HOST" ] && missing+=("KNOWNHOST_SSH_HOST")
          [ -z "$KH_USER" ] && missing+=("KNOWNHOST_SSH_USER")
          [ -z "$KH_KEY" ] && missing+=("KNOWNHOST_SSH_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Marketing deploy blocked — secrets missing: ${missing[*]}"
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # cPanel addon domains live UNDER public_html (the Apache vhost for
          # broadcastcopy.ai has DocumentRoot public_html/broadcastcopy.ai).
          # The SFTP session starts in the user's home, so a bare
          # "broadcastcopy.ai" would create a sibling of public_html that
          # Apache never serves — the path must include public_html/.
          TARGET="${KH_PATH:-public_html/broadcastcopy.ai}"
          TARGET="${TARGET%/}"

          # SAFETY: this job runs `mirror --reverse --delete`. Pointed at the
          # station docroot it would DELETE the live WCCG site. Refuse empty,
          # root, home, and public_html ITSELF — but allow subdirectories of
          # public_html, which is where addon-domain docroots legitimately live.
          case "$TARGET" in
            ""|"/"|"~"|"."|"public_html"|"/public_html"|"~/public_html")
              echo "::error::Refusing to deploy — KNOWNHOST_MARKETING_PATH ('$TARGET') is the station docroot or filesystem root."
              echo "can_deploy=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          echo "Deploy target: $TARGET"

      - name: Download build artifact
        if: steps.preflight.outputs.can_deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: marketing-build
          path: out

      - name: Write SSH deploy key
        if: steps.preflight.outputs.can_deploy == 'true'
        env:
          KH_KEY: ${{ secrets.KNOWNHOST_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KH_KEY" > ~/.ssh/knownhost_deploy
          chmod 600 ~/.ssh/knownhost_deploy

      - name: Probe SSH + ensure docroot exists
        if: steps.preflight.outputs.can_deploy == 'true'
        env:
          TARGET: ${{ steps.preflight.outputs.target }}
        run: |
          set +e
          PORT="${{ secrets.KNOWNHOST_SSH_PORT }}"
          PORT="${PORT:-22}"
          USER="${{ secrets.KNOWNHOST_SSH_USER }}"
          HOST="${{ secrets.KNOWNHOST_SSH_HOST }}"
          ssh -i ~/.ssh/knownhost_deploy -p "$PORT" -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 -o BatchMode=yes -o IdentitiesOnly=yes \
            "$USER@$HOST" \
            "mkdir -p '$TARGET' && chmod 755 '$TARGET' && echo SSH_OK && ls -ld '$TARGET'"
          rc=$?
          echo "=== Local artifact ==="
          du -sh out && find out -type f | wc -l
          # A deploy that quietly does not deploy is worse than a red build
          # (deploy.yml learned this on 2026-08-03; this workflow re-learned it
          # 2026-08-06→11). Fail loudly.
          if [ $rc -ne 0 ]; then
            echo "::error::SSH probe failed (exit $rc) — deploy key missing from the box, shell disabled, or IP block. NOT deploying."
            exit 1
          fi
          echo "DEPLOY_SAFE=true" >> "$GITHUB_ENV"

      - name: Deploy to KnownHost via rsync (SSH key)
        if: steps.preflight.outputs.can_deploy == 'true' && env.DEPLOY_SAFE == 'true'
        env:
          KH_USER: ${{ secrets.KNOWNHOST_SSH_USER }}
          KH_HOST: ${{ secrets.KNOWNHOST_SSH_HOST }}
          KH_PORT: ${{ secrets.KNOWNHOST_SSH_PORT }}
          TARGET: ${{ steps.preflight.outputs.target }}
        run: |
          set -x
          PORT="${KH_PORT:-22}"
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/knownhost_deploy -p $PORT -o StrictHostKeyChecking=no -o BatchMode=yes -o IdentitiesOnly=yes" \
            --exclude 'cgi-bin/' --exclude '.well-known/' \
            out/ "$KH_USER@$KH_HOST:$TARGET/"
          echo "=== Sanity-check the upload via SSH ==="
          ssh -i ~/.ssh/knownhost_deploy -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes -o IdentitiesOnly=yes \
            "$KH_USER@$KH_HOST" \
            "for f in '$TARGET/index.html' '$TARGET/.htaccess' '$TARGET/download/index.html'; do if [ -f \"\$f\" ]; then echo \"OK   \$f\"; else echo \"MISS \$f\"; fi; done"
