name: Deploy Broadcast Copy (control plane)

# platform.broadcastcopy.ai — the GM/OM control plane (apps/dashboard). Own
# concurrency group + path filter so it never cancels a station or marketing
# deploy, and isn't rebuilt for unrelated changes.
#
# COUPLING WARNING: this docroot (public_html/platform.broadcastcopy.ai) sits
# inside the WCCG docroot, so deploy.yml's `mirror --delete` into public_html/
# MUST keep its `--exclude-glob platform.broadcastcopy.ai/`. Without it, the
# WCCG deploy (which also runs on a 4x/day cron) silently deletes this site.

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'deploy-dashboard'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build control plane
        env:
          # PUBLIC by design — project URL + sb_publishable_* client key
          # (RLS-protected). The control plane reads org/station data as the
          # logged-in user; anon can read nothing sensitive.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://irjiqbmoohklagdegezz.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_w9EytFGBM7mEvefmGhsZ9w_bXbmNjQ4' }}
        run: pnpm --filter dashboard build

      - name: Generate index.html for directories
        run: |
          cd apps/dashboard/out
          find . -maxdepth 5 -name "*.html" \
            -not -name "index.html" \
            -not -name "404.html" \
            -not -name "_not-found.html" | while read html; do
            dir="${html%.html}"
            if [ -d "$dir" ] && [ ! -f "$dir/index.html" ]; then
              cp "$html" "$dir/index.html"
            fi
          done

      - name: Upload control-plane artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: apps/dashboard/out
          include-hidden-files: true

  deploy-knownhost:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Auth is the ed25519 deploy key, NOT the account password - the same port
      # deploy-marketing.yml got on 2026-08-11 (the 2026-08-06 KnownHost migration
      # invalidated the stored password). This workflow was never converted: its
      # password SSH probe failed, it wrote DEPLOY_SAFE=false as a WARNING, skipped
      # the upload and reported SUCCESS - platform.broadcastcopy.ai sat on its
      # 2026-08-01 build through every "green" run until 2026-09-27 (found when the
      # warm-paper palette did not appear). A deploy that does not deploy now FAILS.
      - name: Preflight — required secrets + docroot safety
        id: preflight
        env:
          KH_HOST: ${{ secrets.KNOWNHOST_SSH_HOST }}
          KH_USER: ${{ secrets.KNOWNHOST_SSH_USER }}
          KH_KEY: ${{ secrets.KNOWNHOST_SSH_KEY }}
          KH_PATH: ${{ secrets.KNOWNHOST_DASHBOARD_PATH }}
        run: |
          missing=()
          [ -z "$KH_HOST" ] && missing+=("KNOWNHOST_SSH_HOST")
          [ -z "$KH_USER" ] && missing+=("KNOWNHOST_SSH_USER")
          [ -z "$KH_KEY" ] && missing+=("KNOWNHOST_SSH_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Control-plane deploy blocked — secrets missing: ${missing[*]}"
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # cPanel addon domains live UNDER public_html (the Apache vhost for
          # platform.broadcastcopy.ai has DocumentRoot
          # public_html/platform.broadcastcopy.ai). The SSH session starts in
          # the user's home, so the path must include public_html/ or the upload
          # lands in a sibling directory Apache never serves.
          TARGET="${KH_PATH:-public_html/platform.broadcastcopy.ai}"
          TARGET="${TARGET%/}"

          # SAFETY: this job runs `rsync --delete`. Refuse the filesystem root,
          # home, public_html itself (the station docroot), and the MARKETING
          # docroot — but allow other public_html subdirectories.
          case "$TARGET" in
            ""|"/"|"~"|"."|"public_html"|"/public_html"|"~/public_html"|"broadcastcopy.ai"|"public_html/broadcastcopy.ai")
              echo "::error::Refusing to deploy — KNOWNHOST_DASHBOARD_PATH ('$TARGET') is the filesystem root, station docroot, or the marketing docroot."
              echo "can_deploy=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          echo "Deploy target: $TARGET"

      - name: Download build artifact
        if: steps.preflight.outputs.can_deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dashboard-build
          path: out

      - name: Write SSH deploy key
        if: steps.preflight.outputs.can_deploy == 'true'
        env:
          KH_KEY: ${{ secrets.KNOWNHOST_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KH_KEY" > ~/.ssh/knownhost_deploy
          chmod 600 ~/.ssh/knownhost_deploy

      - name: Probe SSH + ensure docroot exists
        if: steps.preflight.outputs.can_deploy == 'true'
        env:
          TARGET: ${{ steps.preflight.outputs.target }}
        run: |
          set +e
          PORT="${{ secrets.KNOWNHOST_SSH_PORT }}"
          PORT="${PORT:-22}"
          USER="${{ secrets.KNOWNHOST_SSH_USER }}"
          HOST="${{ secrets.KNOWNHOST_SSH_HOST }}"
          ssh -i ~/.ssh/knownhost_deploy -p "$PORT" -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 -o BatchMode=yes -o IdentitiesOnly=yes \
            "$USER@$HOST" \
            "mkdir -p '$TARGET' && chmod 755 '$TARGET' && echo SSH_OK && ls -ld '$TARGET'"
          rc=$?
          echo "=== Local artifact ==="
          du -sh out && find out -type f | wc -l
          if [ $rc -ne 0 ]; then
            echo "::error::SSH probe failed (exit $rc) — deploy key missing from the box, shell disabled, or IP block. NOT deploying."
            exit 1
          fi
          echo "DEPLOY_SAFE=true" >> "$GITHUB_ENV"

      - name: Deploy to KnownHost via rsync (SSH key)
        if: steps.preflight.outputs.can_deploy == 'true' && env.DEPLOY_SAFE == 'true'
        env:
          KH_USER: ${{ secrets.KNOWNHOST_SSH_USER }}
          KH_HOST: ${{ secrets.KNOWNHOST_SSH_HOST }}
          KH_PORT: ${{ secrets.KNOWNHOST_SSH_PORT }}
          TARGET: ${{ steps.preflight.outputs.target }}
        run: |
          set -x
          PORT="${KH_PORT:-22}"
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/knownhost_deploy -p $PORT -o StrictHostKeyChecking=no -o BatchMode=yes -o IdentitiesOnly=yes" \
            --exclude 'cgi-bin/' --exclude '.well-known/' \
            out/ "$KH_USER@$KH_HOST:$TARGET/"
          echo "=== Sanity-check the upload via SSH ==="
          ssh -i ~/.ssh/knownhost_deploy -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes -o IdentitiesOnly=yes \
            "$KH_USER@$KH_HOST" \
            "for f in '$TARGET/index.html' '$TARGET/.htaccess' '$TARGET/login/index.html'; do if [ -f \"\$f\" ]; then echo \"OK   \$f\"; else echo \"MISS \$f\"; fi; done"
